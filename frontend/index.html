<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f6">
  <meta name="description" content="Organize lecture recordings, prepare study notes, ask questions about course material, and practise with quizzes.">
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
  <title>Campus Study Desk | Student Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>window.API_BASE = "";</script>
</head>
<body class="auth-screen">
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/dashboard" aria-label="Campus Study Desk home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 8.5 12 4l9 4.5-9 4.5L3 8.5Z"/><path d="M6.5 10.5v5.2c3.4 2.4 7.6 2.4 11 0v-5.2M21 9v6"/></svg></span>
        <span class="brand-copy"><strong>Campus</strong><small>STUDY DESK</small></span>
      </a>
      <a href="#/dashboard" class="new-lecture-nav" aria-label="Start a new study session"><span data-icon="plus"></span><span>New lecture</span></a>
      <div class="nav-caption">Library</div>
      <nav id="nav" aria-label="Main navigation">
        <a href="#/dashboard" data-r="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Dashboard</span></a>
        <a href="#/lectures" data-r="lectures"><span class="nav-icon" data-icon="library"></span><span>My Lectures</span><span class="nav-count" id="nav-count">0</span></a>
        <a href="#/workspace" data-r="workspace"><span class="nav-icon" data-icon="brain"></span><span>Study Workspace</span></a>
        <a href="#/farms" data-r="farms" hidden><span class="nav-icon" data-icon="sprout"></span><span>Farm data</span></a>
        <a href="#/admin" data-r="admin" hidden><span class="nav-icon" data-icon="shield-check"></span><span>Administration</span></a>
      </nav>
      <div class="side-bottom">
        <div class="side-note"><span class="online-dot"></span><span>Designed for lecture-based study</span></div>
        <button id="theme" class="theme-toggle" type="button"><span data-icon="moon"></span><span class="theme-label">Dark appearance</span><span class="toggle-track"><i></i></span></button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-context"><span class="context-mark"></span><span>STUDENT PORTAL</span><span class="context-divider">/</span><span id="top-page">Overview</span></div>
        <div class="topbar-actions">
          <label class="global-search"><button type="button" class="search-icon" id="searchToggle" aria-label="Search lectures"><span data-icon="search"></span></button><input id="globalSearch" type="search" placeholder="Search your lectures..." aria-label="Search your lectures"><kbd>↵</kbd></label>
          <button class="icon-button theme-mobile" id="themeMobile" type="button" aria-label="Switch to dark appearance" aria-pressed="false"><span data-icon="moon"></span></button>
          <button class="icon-button" id="notify" type="button" aria-label="Notifications"><span data-icon="bell"></span><i></i></button>
          <div class="profile-chip" aria-label="Signed-in account"><span class="avatar" id="profile-avatar">U</span><span class="profile-copy"><strong id="profile-name">Account</strong><small id="profile-role">Signed out</small></span></div>
          <button type="button" class="btn btn-sm" id="logout" hidden>Sign out</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="page-footer"><span>© <span id="year"></span> Campus Study Desk</span><nav class="footer-links" aria-label="Legal information"><a href="#/privacy">Privacy policy</a><a href="#/terms">Terms and conditions</a></nav></footer>
    </div>

    <aside class="info" id="info" aria-label="Study overview"></aside>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
